<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>공부하니</title>
<meta name="description" content="원광한의대 학습 자료 아카이브">
<meta property="og:type" content="website">
<meta property="og:site_name" content="공부하니">
<meta property="og:title" content="공부하니 By. KIKY">
<meta property="og:description" content="원광한의대 학습 자료 아카이브">
<meta property="og:url" content="https://kiky-wku.github.io/KMED-Archive/">
<meta property="og:image" content="https://kiky-wku.github.io/KMED-Archive/icons/og.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부하니">
<script>
// 카카오톡 안에서 열면 기본 브라우저(아이폰은 사파리)로 다시 열기
(function () {
  var ua = navigator.userAgent || '';
  if (!/KAKAOTALK/i.test(ua)) return;
  var url = location.href;
  try { if (sessionStorage.getItem('kmed:ext') === url) { window.__inapp = true; return; } sessionStorage.setItem('kmed:ext', url); } catch (e) {}
  location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  window.__inapp = true;
})();
</script>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" href="icons/favicon.png?v=5">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="inapp" class="inapp" hidden>
  <div class="inapp-box">
    <div class="inapp-emo">🧭</div>
    <h2>사파리에서 열어 주세요</h2>
    <p id="inapp-how">카카오톡 안에서는 일부 기능이 제대로 동작하지 않습니다.</p>
    <button id="inapp-go" class="btn">브라우저로 열기</button>
    <button id="inapp-skip" class="inapp-skip">그냥 여기서 볼게요</button>
  </div>
</div>
<script>
// 자동으로 안 넘어가면 안내 화면
(function () {
  if (!window.__inapp) return;
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  setTimeout(function () {
    if (document.hidden) return;
    var el = document.getElementById('inapp');
    document.getElementById('inapp-how').textContent = ios
      ? '아래 버튼이 안 되면, 오른쪽 아래 공유 버튼을 누르고 Safari를 고르세요.'
      : '아래 버튼이 안 되면, 오른쪽 위 ⋮ 메뉴에서 다른 브라우저로 열기를 고르세요.';
    el.hidden = false;
    document.getElementById('inapp-go').onclick = function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); };
    document.getElementById('inapp-skip').onclick = function () { el.hidden = true; };
  }, 1200);
})();
</script>
<div id="toast" class="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
